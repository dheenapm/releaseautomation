name: Release to Production – QA Sign-off

on:
  pull_request:
    branches:
      - production
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read
  pull-requests: read

jobs:
  qa-signoff:
    name: QA Sign-off Required
    runs-on: ubuntu-latest
    environment:
      name: qa-prod-signoff
    steps:
      - name: Pause for QA approval
        run: |
          echo "⏸ Waiting for QA approval before proceeding to production"
          echo "PR #: ${{ github.event.pull_request.number }}"
          echo "Source branch: ${{ github.head_ref }}"
